	<script>
		// language picker: remember the choice and reload so every label is rebuilt in the new language
		try {
			var sel = document.getElementById("langSel");
			sel.value = langChoice;
			sel.addEventListener("change", function () {
				try { localStorage.setItem("elementalLang", sel.value); } catch (e) {}
				location.reload();
			});
		} catch (err) { console.error(err); }

		// show only the fields that make sense for the chosen mode (if this fails, all fields stay visible)
		try {
			var items = Array.prototype.slice.call(document.querySelectorAll("sdpi-item[data-modes], sdpi-item[data-when]"));
			var apply = function (s) {
				s = s || {};
				var mode = s.mode || "clock";
				items.forEach(function (el) {
					var ok = true;
					var modes = el.getAttribute("data-modes");
					if (modes && modes.split(" ").indexOf(mode) < 0) ok = false;
					var when = el.getAttribute("data-when");
					if (ok && when) {
						var kv = when.split("=");
						var cur = s[kv[0]];
						if (cur === undefined) cur = kv[0] === "accentMode" ? "theme" : kv[0] === "tz" ? "local" : kv[0] === "tz2" ? "America/New_York" : kv[0] === "ledMode" ? "auto" : undefined;
						ok = kv[1].split(",").indexOf(cur) >= 0;
					}
					el.style.display = ok ? "" : "none";
				});
			};
			var client = SDPIComponents.streamDeckClient;
			// Próbnik koloru bywa pokazywany z domyślną wartością, której nie ma w ustawieniach (a po otwarciu zapisuje czerń):
			// wpisujemy kolor do ustawień od razu, żeby to, co widać w próbniku, było tym, co dostaje plugin
			var THEME_ACCENT = { black: "#38bdf8", midnight: "#7dd3fc", aurora: "#34d399", sunset: "#fb923c", forest: "#a3e635", mono: "#ffffff", paper: "#c2410c" };
			var LED_PALETTE = ["#ff0080","#ff0000","#ff8000","#ffff00","#80ff00","#00ff00","#00ff80","#00ffff","#0080ff","#0000ff","#8000ff","#ff00ff"];
			var prevLed = null;
			var ledSeen = false;
			// podgląd obu bocznych diod: kolor stały albo animacja odpowiadająca wybranemu efektowi
			var preview = function (s) {
				var mode = s.ledMode || "auto";
				var base = s.accentMode === "custom" ? (s.accent || "#38bdf8") : (THEME_ACCENT[s.theme || "black"] || "#38bdf8");
				var bg = base, anim = "";
				if (mode === "color") bg = s.ledColor || "#ff0080";
				else if (mode === "rainbow") { bg = "#ff0000"; anim = "ledhue 24s linear infinite"; }
				else if (mode === "pulse") anim = "ledpulse 3.5s ease-in-out infinite";
				else if (mode === "temp") bg = "linear-gradient(90deg,#34d399,#fbbf24,#f85252)";
				else if (mode === "hours") bg = "linear-gradient(90deg,#0b1a4a,#ff7a3d,#ffd36b,#7fd8ff,#ff6a3d,#7a3cff)";
				else if (mode === "weekday") bg = "linear-gradient(90deg,#a855f7,#ef4444,#f97316,#eab308,#22c55e,#06b6d4,#3b82f6)";
				else if (mode === "alert") { bg = "#ff2d2d"; anim = "ledflash 1s steps(1) infinite"; }
				["ledL", "ledR"].forEach(function (id) {
					var el = document.getElementById(id);
					if (el) { el.style.background = bg; el.style.animation = anim; }
				});
			};
			var ensureDefaults = function (s) {
				preview(s);
				var patch = {};
				if (s.accentMode === "custom" && !s.accent) patch.accent = "#38bdf8";
				if (LED_PALETTE.indexOf((s.ledColor || "").toLowerCase()) < 0 && (s.ledMode === "color" || s.ledColor)) patch.ledColor = LED_PALETTE[0]; // kolor spoza palety (np. dawny dowolny) zastępujemy domyślnym
				// wybranie koloru w próbniku diod włącza tryb "Własny kolor", jeśli był tryb domyślny
				if (ledSeen && s.ledColor && s.ledColor !== prevLed && (!s.ledMode || s.ledMode === "auto")) patch.ledMode = "color";
				ledSeen = true;
				prevLed = s.ledColor || null;
				if (Object.keys(patch).length) { try { client.setSettings(Object.assign({}, s, patch)); } catch (e) { console.error(e); } }
			};
			var refresh = function () { client.getSettings().then(function (e) { apply(e.payload.settings); ensureDefaults(e.payload.settings || {}); }); };
			refresh();
			client.didReceiveSettings.subscribe(function (e) { apply(e.payload.settings); ensureDefaults(e.payload.settings || {}); });
			// zmiana dowolnego pola: pobierz ustawienia ponownie i przelicz widoczność (zaraz i po chwili, gdy zapis już dotarł)
			["change", "input", "click"].forEach(function (ev) { document.addEventListener(ev, function () { setTimeout(refresh, 80); setTimeout(refresh, 400); }, true); });
		} catch (err) { console.error(err); }
	</script>
</body>
</html>
